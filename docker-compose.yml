# WordPress + MySQL + phpMyAdmin lab
# Same setup as the "docker run" commands in docker.txt, defined in one file.
#
# Usage:
#   cp .env.example .env     # then edit the passwords in .env
#   docker compose up -d     # start all services
#   docker compose down      # stop and remove containers (data stays in the volume)
#   docker compose down -v   # also delete the database volume

services:
  mysql:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress_db}
      MYSQL_USER: ${MYSQL_USER:-wp_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql   # keep data when the container is recreated
    healthcheck:
      # WordPress should only start after MySQL accepts connections
      # $$ = read the variable inside the container, not when compose parses this file
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wordpress

  wordpress:
    image: wordpress
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: mysql   # service name works as a hostname on the same network
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress_db}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wp_user}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    networks:
      - wordpress

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8888:80"
    environment:
      PMA_HOST: mysql   # connect to the mysql service directly
    networks:
      - wordpress

volumes:
  db_data:

networks:
  wordpress:
